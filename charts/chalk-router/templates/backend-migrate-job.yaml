apiVersion: batch/v1
kind: Job
metadata:
  name: chalk-router-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app: chalk-router
    job: migrate
    {{- include "chalk-router.commonLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: chalk-router
        job: migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "chalk-router.podSecurity" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          securityContext:
            {{- include "chalk-router.containerSecurity" . | nindent 12 }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/app/openai-server", "migrate"]
          envFrom:
            - secretRef:
                name: {{ .Values.servingSecretName }}
          env:
            {{- include "chalk-router.environmentEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
