apiVersion: v1
kind: Service
metadata:
  name: mock-openai
  labels:
    {{- include "mock-openai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-openai
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
