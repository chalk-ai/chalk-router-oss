name: Router CI

on:
  pull_request:
  push:
    branches: [main]

# No write token, OIDC token, environment secrets, or private infrastructure.
permissions:
  contents: read

concurrency:
  group: router-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check public distribution boundaries
        run: python3 scripts/check-public-distribution.py
      - name: Install the repository's pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt -p openai-server -- --check
      - name: Clippy
        run: cargo clippy --locked -p openai-server -- -D warnings
      - name: Install pinned nextest
        run: cargo install cargo-nextest --version '=0.9.148' --locked
      - name: Test synthetic fixtures with disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          trap 'scripts/test-postgres.sh stop' EXIT
          url="$(scripts/test-postgres.sh start)"
          ROUTER_DATABASE_URL="$url" CHALK_ENVIRONMENT_ID=test-db \
            cargo run --locked --quiet --bin openai-server -- migrate
          TEST_DATABASE_URL="$url" cargo nextest run --locked -p openai-server --profile ci
      - name: Probe every admin RPC without credentials over HTTP/2 and gRPC-Web
        run: python3 scripts/check-anonymous-admin.py --binary target/debug/openai-server
      - name: Verify schema and migration upgrade fixtures
        run: scripts/schema.sh --check

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      - run: npm run test:auth
