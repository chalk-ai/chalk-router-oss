name: Update rate cards

on:
  schedule:
    - cron: '17 8 * * *' # Daily at 08:17 UTC.
  workflow_dispatch:

# Generation and publishing use separate runners. Only publishing gets a bot credential.
permissions:
  contents: read

concurrency:
  group: rate-card-updates
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'chalk-ai/chalk-router-oss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test catalog generation and PR updates
        run: python -S -m unittest scripts.test_fetch_rate_cards scripts.test_update_rate_cards_pr -v
      - name: Install hash-locked generator dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-rate-cards.txt
      - name: Fetch current prices
        run: python scripts/fetch_rate_cards.py
      - name: Upload the generated JSON only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rate-cards
          path: prices/rate_cards.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: github.repository == 'chalk-ai/chalk-router-oss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the generated catalog outside the source checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rate-cards
          path: ${{ runner.temp }}/rate-card-candidate
      - name: Open or update the rate-card PR
        env:
          GH_TOKEN: ${{ secrets.RATE_CARD_GITHUB_TOKEN }}
        # No pip install or site-packages in this job; JSON is validated as data.
        run: python -S -m scripts.update_rate_cards_pr --catalog "$RUNNER_TEMP/rate-card-candidate/rate_cards.json"
