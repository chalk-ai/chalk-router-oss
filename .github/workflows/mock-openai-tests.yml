name: Mock OpenAI tests

on:
  pull_request:
    paths:
      - 'test_services/mock_openai/**'
      - '.github/workflows/mock-openai-tests.yml'
      - 'Justfile'
  push:
    branches: [main]
    paths:
      - 'test_services/mock_openai/**'
      - '.github/workflows/mock-openai-tests.yml'
      - 'Justfile'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the mock's pinned dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --project test_services/mock_openai --locked --no-install-project --python 3.13
      - name: Exercise response lifecycle
        run: test_services/mock_openai/.venv/bin/python -m unittest discover -s test_services/mock_openai -p 'test_*.py' -v
